version: "3.8"

services:
  nrpc-server:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./nrpc.pid:/app/nrpc.pid

    healthcheck:
      test: ["CMD-SHELL", "npm run health-check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
